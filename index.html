<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaisingWell</title>
  <style>
    :root {
      --bg: #f7f1e8;
      --paper: #fffdf8;
      --ink: #21313b;
      --muted: #5d6b71;
      --brand: #bd6b3e;
      --brand-deep: #8e4f2c;
      --leaf: #506a52;
      --line: rgba(33, 49, 59, 0.08);
      --shadow: 0 18px 48px rgba(66, 42, 22, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 10%, rgba(215, 164, 71, 0.22), transparent 28%),
        radial-gradient(circle at 86% 6%, rgba(80, 106, 82, 0.12), transparent 26%),
        linear-gradient(180deg, #f6efe3 0%, var(--bg) 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(100% - 32px, 980px);
      margin: 42px auto 54px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 46px 44px 42px;
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -90px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(189, 107, 62, 0.08);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 13px;
      border-radius: 999px;
      color: var(--brand-deep);
      background: rgba(189, 107, 62, 0.1);
      font-size: 14px;
    }

    h1 {
      position: relative;
      margin: 16px 0 8px;
      font-family: Georgia, "Times New Roman", "Source Han Serif SC", "Noto Serif SC", serif;
      font-size: clamp(54px, 9vw, 104px);
      line-height: 0.98;
      letter-spacing: 0;
      color: var(--ink);
      z-index: 1;
    }

    h2 {
      position: relative;
      margin: 0 0 16px;
      font-family: "Source Han Serif SC", "Noto Serif SC", "STSong", serif;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.22;
      color: var(--brand-deep);
      z-index: 1;
    }

    .hero p {
      position: relative;
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      z-index: 1;
    }

    .cards {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 253, 248, 0.95);
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(73, 50, 33, 0.08);
      color: inherit;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(189, 107, 62, 0.28);
      background: #fffaf1;
    }

    .card-kicker {
      display: inline-flex;
      margin-bottom: 9px;
      color: var(--leaf);
      font-size: 13px;
      font-weight: 700;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--brand-deep);
      font-family: "Source Han Serif SC", "Noto Serif SC", "STSong", serif;
      font-size: 24px;
    }

    .card span {
      display: block;
      color: var(--muted);
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 9px 14px;
      border-radius: 999px;
      color: var(--brand-deep);
      background: rgba(189, 107, 62, 0.1);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    footer {
      margin-top: 24px;
      padding: 18px 4px 0;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 18px, 980px);
        margin: 14px auto 36px;
      }

      .hero,
      .card {
        padding: 18px 14px;
        border-radius: 18px;
      }

      h1 {
        font-size: clamp(46px, 17vw, 72px);
      }

      h2 {
        font-size: 24px;
      }

      .hero p {
        font-size: 15px;
      }

      .card {
        grid-template-columns: 1fr;
      }

      .card strong {
        font-size: 21px;
      }

      .card-action {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="eyebrow">Family learning notes</div>
      <h1>RaisingWell</h1>
      <h2>家庭教育与儿童发展工具</h2>
      <p>整理可直接使用的家庭养育、儿童发展和学习支持资料。</p>
    </section>

    <section class="cards" aria-label="页面入口">
      <a class="card" href="learning-profile.html">
        <span>
          <span class="card-kicker">0-12 岁学习支持</span>
          <strong>儿童学习画像与培养框架</strong>
          <span>从发展观察到学习支持，帮助家长判断学习入口、策略、动机和迁移。</span>
        </span>
        <span class="card-action">进入查看</span>
      </a>
      <a class="card" href="infant-care.html">
        <span>
          <span class="card-kicker">0-3 岁照护指南</span>
          <strong>3岁以下婴幼儿健康养育照护操作指南</strong>
          <span>围绕日常照护、发育监测、营养喂养、交流玩耍和风险预防整理。</span>
        </span>
        <span class="card-action">进入查看</span>
      </a>
    </section>

    <footer>欢迎收藏、推荐给需要的家长，也欢迎持续关注后续整理的家庭教育工具。</footer>
  </main>
</body>
</html>
